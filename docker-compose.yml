services:
  db:
    image: postgres:15-alpine
    container_name: rung-db
    restart: always
    environment:
      POSTGRES_USER: rung_user
      POSTGRES_PASSWORD: rung_password
      POSTGRES_DB: rung_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rung_user -d rung_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: rung-web
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rung_user:rung_password@db:5432/rung_db
      PROJECT_NAME: RUNG
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata: