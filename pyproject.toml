[tool.poetry]
name = "qa-sistem"
version = "0.1.0"
description = "QA-sistema"
authors = ["Natasha <nabarabanova@kpfu.ru>"]
package-mode = false 

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.146.0,<0.147.0"
uvicorn = {extras = ["standard"], version = ">=0.54.0,<0.55.0"}
python-dotenv = ">=1.2.4,<2.0.0"
pydantic-settings = ">=2.16.0,<3.0.0"
httpx = "^0.28"
sqlalchemy = {extras = ["asyncio"], version = ">=2.1.6,<3.0.0"}
asyncpg = ">=0.32.0,<0.33.0"
aiosqlite = ">=0.22.1,<0.23.0"
python-multipart = ">=0.0.32,<0.0.33"
passlib = {extras = ["bcrypt"], version = ">=1.7.4,<2.0.0"}
python-jose = {extras = ["cryptography"], version = ">=3.5.0,<4.0.0"}
email-validator = ">=2.3.0,<3.0.0"

# --- ДОБАВЛЕНО ПО ТРЕБОВАНИЮ ЧЕК-ЛИСТА ---
bcrypt = "<5.0.0"
pyjwt = "^2.14.0"
# ------------------------------------------

celery = ">=5.6.3,<6.0.0"
redis = ">=8.1.0,<9.0.0"
qdrant-client = ">=1.19.1,<2.0.0"
sentence-transformers = ">=6.1.0,<7.0.0"
transformers = ">=5.20.1,<6.0.0"
torch = ">=2.14.1,<3.0.0"
sentencepiece = ">=0.2.2,<0.3.0"
sacrebleu = ">=2.6.0,<3.0.0"
bert-score = ">=0.3.13,<0.4.0"
evaluate = ">=0.4.6,<0.5.0"
rank-bm25 = ">=0.2.2,<0.3.0"
nltk = ">=3.10.3,<4.0.0"
python-json-logger = ">=4.2.0,<5.0.0"
psycopg2-binary = ">=2.9.13,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"      
pytest-asyncio = ">=0.23.0,<1.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
pytest-mock = ">=3.17.0,<4.0.0"
black = ">=24.0.0,<25.0.0"
mypy = ">=1.0.0,<2.0.0"
ruff = ">=0.1.0,<1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]

[[tool.poetry.packages]]
include = "backend"